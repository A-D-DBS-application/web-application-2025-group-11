{% extends "base.html" %}

{% block content %}
<div class="container" style="margin-top: 60px; max-width: 600px; margin-bottom: 80px;">
    
    <h1 style="color: #593C28; margin-bottom: 30px; text-align: center;">Mijn Profiel</h1>

    <div class="cart-container">
        <form action="{{ url_for('main.profile') }}" method="POST">
            
            <h3 style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">👤 Persoonlijke Gegevens</h3>
            
            <div style="margin-bottom: 15px;">
                <label class="form-label">Volledige Naam</label>
                <input type="text" name="full_name" value="{{ user.full_name }}" required class="form-input">
            </div>

            <div style="margin-bottom: 15px;">
                <label class="form-label">Telefoonnummer</label>
                <input type="text" name="phone_number" value="{{ user.phone_number or '' }}" placeholder="+32 ..." class="form-input">
            </div>

            <div style="margin-bottom: 30px;">
                <label class="form-label">E-mailadres</label>
                <input type="text" value="{{ session.user_email }}" disabled class="form-input" style="background: #f9f9f9; color: #888;">
                <small style="color: #999;">E-mail kan niet gewijzigd worden.</small>
            </div>

            <h3 style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">🔒 Beveiliging</h3>
            
            <div style="margin-bottom: 15px;">
                <label class="form-label">Nieuw Wachtwoord (Optioneel)</label>
                <input type="password" name="new_password" placeholder="Laat leeg om te behouden" class="form-input">
            </div>

            <button type="submit" class="btn-bestel" style="width: 100%; padding: 15px; font-size: 1.1em;">
                Gegevens Opslaan
            </button>
        </form>
    </div>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('main.logout') }}" style="color: #E63946; text-decoration: underline;">Uitloggen</a>
    </div>

</div>
{% endblock %}
