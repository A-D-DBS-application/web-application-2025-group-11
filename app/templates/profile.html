{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">
    
    <h1 class="h2 text-brown fw-bold text-center mb-4">Mijn Profiel</h1>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form action="{{ url_for('main.profile') }}" method="POST">
                
                <h5 class="text-brown border-bottom pb-2 mb-3 mt-1">
                    👤 Persoonlijke Gegevens
                </h5>
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">Volledige Naam</label>
                    <input type="text" name="full_name" value="{{ user.full_name }}" required class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">Telefoonnummer</label>
                    <input type="text" name="phone_number" value="{{ user.phone_number or '' }}" placeholder="+32 ..." class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small">E-mailadres</label>
                    <input type="text" value="{{ session.user_email }}" class="form-control bg-light" disabled>
                    <div class="form-text">E-mail kan niet gewijzigd worden.</div>
                </div>

                <h5 class="text-brown border-bottom pb-2 mb-3">
                    🔒 Beveiliging
                </h5>
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small">Nieuw Wachtwoord (Optioneel)</label>
                    <input type="password" name="new_password" placeholder="Laat leeg om te behouden" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fs-5 shadow-sm">
                    Gegevens Opslaan
                </button>
            </form>
        </div>
    </div>
    
    <div class="text-center mt-4">
        <a href="{{ url_for('main.logout') }}" class="btn btn-outline-danger btn-sm">
            Uitloggen
        </a>
    </div>

</div>
{% endblock %}
