<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Bakkerij Oewist</title>
    
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #fdfbf7;">
    
    {% include 'partials/navbar.html' %}

    <div class="container mt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>

    <main class="flex-fill">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/nl.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Zoek naar oude selectors (.quantity-selector) EN nieuwe bootstrap selectors (.input-group)
            const selectors = '.quantity-selector, .input-group';

            document.querySelectorAll(selectors).forEach(function(group) {
                const input = group.querySelector('.quantity-input');
                const btnMinus = group.querySelector('.minus');
                const btnPlus = group.querySelector('.plus');

                // Check of alle onderdelen bestaan in dit groepje
                if (input && btnMinus && btnPlus) {
                    
                    // Plus knop
                    btnPlus.addEventListener('click', function(e) {
                        // Voorkom dat hij het formulier verstuurt (indien type="submit")
                        if(btnPlus.type !== 'submit') { 
                            e.preventDefault(); 
                            let val = parseInt(input.value) || 0;
                            input.value = val + 1;
                        }
                    });

                    // Min knop
                    btnMinus.addEventListener('click', function(e) {
                        if(btnMinus.type !== 'submit') {
                            e.preventDefault();
                            let val = parseInt(input.value) || 0;
                            if (val > 1) input.value = val - 1;
                        }
                    });
                }
            }); 
        });
    </script>
</body>
</html>
