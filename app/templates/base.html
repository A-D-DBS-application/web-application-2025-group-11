<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakkerij Oewist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="main-header">
    <div class="container header-content">
        <a href="/" class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Bakkerij Oewist">
        </a>

        <nav class="main-nav">
            <ul>
                <li><a href="#">Brood</a></li>
                <li><a href="#">Pistoles</a></li>
                <li><a href="#">Koffiekoeken</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="header-icons" style="display: flex; align-items: center;">
            {% if current_user %}
                <span style="color: white; margin-right: 15px; font-weight: bold; display: flex; align-items: center;">
                    Hoi, {{ current_user.full_name.split(' ')[0] or 'Klant' }}!
                </span>
                <a href="{{ url_for('main.logout') }}" class="icon-link" title="Uitloggen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" width="32" height="32">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                    </svg>
                </a>
            {% else %}
                <a href="{{ url_for('main.login') }}" class="icon-link" title="Inloggen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" width="32" height="32">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                </a>
            {% endif %}

            <a href="#" class="icon-link" title="Winkelwagen" style="margin-left: 15px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" width="32" height="32">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                </svg>
            </a>
        </div> </div> </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
