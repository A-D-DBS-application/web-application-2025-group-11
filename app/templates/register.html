{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <h1 class="h3 mb-4 text-brown fw-bold">Registreren</h1>
                    
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form action="{{ url_for('main.register') }}" method="POST" class="text-start">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Volledige Naam</label>
                            <input type="text" name="full_name" required class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">E-mailadres</label>
                            <input type="email" name="email" required class="form-control">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Wachtwoord</label>
                            <input type="password" name="password" required minlength="6" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Account Aanmaken</button>
                    </form>

                    <p class="mt-4 mb-0 text-muted small">
                        Heb je al een account? <a href="{{ url_for('main.login') }}" class="text-brown fw-bold">Log hier in.</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
