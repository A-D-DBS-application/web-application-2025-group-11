<header class="main-header">
    <div class="container header-content">
        <a href="{{ url_for('main.index') }}" class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Bakkerij Oewist">
        </a>

        <nav class="main-nav">
            <ul>
                <li><a href="{{ url_for('main.index', category='brood') }}">Brood</a></li>
                <li><a href="{{ url_for('main.index', category='pistoles') }}">Pistolets</a></li>
                <li><a href="{{ url_for('main.index', category='koffiekoeken') }}">Koffiekoeken</a></li>
                <li><a href="{{ url_for('main.contact') }}">Contact</a></li>
            </ul>
        </nav>

        <div class="header-icons">
            {% if current_user %}
                <div class="user-welcome">
                    <span class="user-name-text">
                        Hoi, {{ current_user.full_name.split(' ')[0] }}
                    </span>
                    
                    <div class="user-links-wrapper">
                        <a href="{{ url_for('main.my_orders') }}" class="user-link">Mijn Bestellingen</a>
                        <span class="nav-separator">|</span>
                        <a href="{{ url_for('main.profile') }}" class="user-link">Profiel</a>
                    </div>
                </div>

                <a href="{{ url_for('main.logout') }}" class="icon-link logout-icon" title="Uitloggen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" width="26" height="26">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
                    </svg>
                </a>
            {% else %}
                <a href="{{ url_for('main.login') }}" class="icon-link" title="Inloggen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" width="28" height="28">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                </a>
            {% endif %}

            <a href="{{ url_for('main.view_cart') }}" class="icon-link cart-icon-wrapper" title="Winkelwagen">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" width="28" height="28">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.0114 60.0114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
                </svg>
                {% if cart_item_count and cart_item_count > 0 %}
                    <span class="cart-badge">{{ cart_item_count }}</span>
                {% endif %}
            </a>
        </div>
    </div>
</header>
