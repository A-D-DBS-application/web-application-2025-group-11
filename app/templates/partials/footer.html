<footer class="main-footer">
    <div class="container footer-content">
        
        <div class="footer-column">
            <h4>Contact</h4>
            <ul>
                {% if settings %}
                    <li>📍 {{ settings.address_text }}</li>
                    <li>📞 {{ settings.phone_number }}</li>
                    <li>✉️ {{ settings.email_address }}</li>
                {% endif %}
            </ul>
        </div>

        <div class="footer-column">
            <h4>Openingsuren</h4>
            <p style="white-space: pre-line; line-height: 1.6;">{% if settings %}{{ settings.opening_hours.strip() }}{% endif %}</p>
        </div>

    </div>
    
    <div class="footer-bottom">
        &copy; {{ current_year }} Bakkerij Oewist - ERP Systeem
    </div>
</footer>
